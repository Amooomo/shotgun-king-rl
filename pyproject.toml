[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotgun-king-rl"
version = "0.1.0"
description = "A reinforcement learning project for Shotgun King"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "gymnasium",
    "stable-baselines3",
    "sb3-contrib",
    "tensorboard",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
